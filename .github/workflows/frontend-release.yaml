name: Frontend üretim paketleri

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.6"

jobs:
  web:
    name: Web üretim paketi
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Flutter kur
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Yayın ayarlarını doğrula
        shell: bash
        env:
          BACKEND_URL: ${{ vars.MAKI_BACKEND_URL }}
          WEB_ORIGIN: ${{ vars.MAKI_WEB_ORIGIN }}
          OIDC_ISSUER: ${{ vars.MAKI_OIDC_ISSUER }}
          OIDC_CLIENT_ID: ${{ vars.MAKI_OIDC_CLIENT_ID }}
          OIDC_AUDIENCE: ${{ vars.MAKI_OIDC_AUDIENCE }}
          BILLING_PRODUCT_ID: ${{ vars.MAKI_BILLING_PRODUCT_ID }}
          PRIVACY_URL: ${{ vars.MAKI_PRIVACY_URL }}
          TERMS_URL: ${{ vars.MAKI_TERMS_URL }}
        run: |
          set -euo pipefail
          for name in BACKEND_URL WEB_ORIGIN OIDC_ISSUER OIDC_CLIENT_ID OIDC_AUDIENCE BILLING_PRODUCT_ID PRIVACY_URL TERMS_URL; do
            [[ -n "${!name}" ]] || { echo "$name eksik"; exit 1; }
          done

      - name: Web paketini üret
        working-directory: frontend
        shell: bash
        env:
          BACKEND_URL: ${{ vars.MAKI_BACKEND_URL }}
          WEB_ORIGIN: ${{ vars.MAKI_WEB_ORIGIN }}
          OIDC_ISSUER: ${{ vars.MAKI_OIDC_ISSUER }}
          OIDC_CLIENT_ID: ${{ vars.MAKI_OIDC_CLIENT_ID }}
          OIDC_AUDIENCE: ${{ vars.MAKI_OIDC_AUDIENCE }}
          BILLING_PRODUCT_ID: ${{ vars.MAKI_BILLING_PRODUCT_ID }}
          PRIVACY_URL: ${{ vars.MAKI_PRIVACY_URL }}
          TERMS_URL: ${{ vars.MAKI_TERMS_URL }}
          SENTRY_DSN: ${{ secrets.MAKI_SENTRY_DSN }}
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          flutter build web --release \
            --dart-define=MAKI_ENV=production \
            --dart-define=BACKEND_URL="$BACKEND_URL" \
            --dart-define=OIDC_ISSUER="$OIDC_ISSUER" \
            --dart-define=OIDC_CLIENT_ID="$OIDC_CLIENT_ID" \
            --dart-define=OIDC_AUDIENCE="$OIDC_AUDIENCE" \
            --dart-define=OIDC_REDIRECT_URI="$WEB_ORIGIN/redirect.html" \
            --dart-define=BILLING_PRODUCT_ID="$BILLING_PRODUCT_ID" \
            --dart-define=ENABLE_STORE_BILLING=true \
            --dart-define=PRIVACY_URL="$PRIVACY_URL" \
            --dart-define=TERMS_URL="$TERMS_URL" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN"

      - name: Web paketini yükle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maki-web-${{ github.ref_name }}
          path: frontend/build/web
          if-no-files-found: error
          retention-days: 30

  android:
    name: İmzalı Android App Bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: production
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Java kur
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Flutter kur
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Mobil yayın ayarlarını doğrula
        shell: bash
        env:
          BACKEND_URL: ${{ vars.MAKI_BACKEND_URL }}
          OIDC_ISSUER: ${{ vars.MAKI_OIDC_ISSUER }}
          OIDC_CLIENT_ID: ${{ vars.MAKI_OIDC_CLIENT_ID }}
          OIDC_AUDIENCE: ${{ vars.MAKI_OIDC_AUDIENCE }}
          PRODUCT_ID: ${{ vars.MAKI_BILLING_PRODUCT_ID }}
          PRIVACY_URL: ${{ vars.MAKI_PRIVACY_URL }}
          TERMS_URL: ${{ vars.MAKI_TERMS_URL }}
        run: |
          set -euo pipefail
          for name in BACKEND_URL OIDC_ISSUER OIDC_CLIENT_ID OIDC_AUDIENCE PRODUCT_ID PRIVACY_URL TERMS_URL; do
            [[ -n "${!name}" ]] || { echo "$name eksik"; exit 1; }
          done

      - name: Android imzasını hazırla
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          [[ -n "$KEYSTORE_BASE64" && -n "$STORE_PASSWORD" && -n "$KEY_PASSWORD" && -n "$KEY_ALIAS" ]]
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > frontend/android/app/maki-release.jks
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=maki-release.jks"
          } > frontend/android/key.properties

      - name: App Bundle üret
        working-directory: frontend
        shell: bash
        env:
          BACKEND_URL: ${{ vars.MAKI_BACKEND_URL }}
          OIDC_ISSUER: ${{ vars.MAKI_OIDC_ISSUER }}
          OIDC_CLIENT_ID: ${{ vars.MAKI_OIDC_CLIENT_ID }}
          OIDC_AUDIENCE: ${{ vars.MAKI_OIDC_AUDIENCE }}
          PRODUCT_ID: ${{ vars.MAKI_BILLING_PRODUCT_ID }}
          PRIVACY_URL: ${{ vars.MAKI_PRIVACY_URL }}
          TERMS_URL: ${{ vars.MAKI_TERMS_URL }}
          SENTRY_DSN: ${{ secrets.MAKI_SENTRY_DSN }}
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          flutter build appbundle --release --obfuscate --split-debug-info=build/symbols \
            --dart-define=MAKI_ENV=production \
            --dart-define=BACKEND_URL="$BACKEND_URL" \
            --dart-define=OIDC_ISSUER="$OIDC_ISSUER" \
            --dart-define=OIDC_CLIENT_ID="$OIDC_CLIENT_ID" \
            --dart-define=OIDC_AUDIENCE="$OIDC_AUDIENCE" \
            --dart-define=OIDC_REDIRECT_URI=com.team120.maki:/oauth2redirect \
            --dart-define=BILLING_PRODUCT_ID="$PRODUCT_ID" \
            --dart-define=ENABLE_STORE_BILLING=true \
            --dart-define=PRIVACY_URL="$PRIVACY_URL" \
            --dart-define=TERMS_URL="$TERMS_URL" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN"

      - name: Android paketini yükle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maki-android-${{ github.ref_name }}
          path: |
            frontend/build/app/outputs/bundle/release/app-release.aab
            frontend/build/symbols
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS derleme doğrulaması
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Flutter kur
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: iOS yayın ayarlarını doğrula
        shell: bash
        env:
          BACKEND_URL: ${{ vars.MAKI_BACKEND_URL }}
          OIDC_ISSUER: ${{ vars.MAKI_OIDC_ISSUER }}
          OIDC_CLIENT_ID: ${{ vars.MAKI_OIDC_CLIENT_ID }}
          OIDC_AUDIENCE: ${{ vars.MAKI_OIDC_AUDIENCE }}
          PRODUCT_ID: ${{ vars.MAKI_BILLING_PRODUCT_ID }}
          PRIVACY_URL: ${{ vars.MAKI_PRIVACY_URL }}
          TERMS_URL: ${{ vars.MAKI_TERMS_URL }}
        run: |
          set -euo pipefail
          for name in BACKEND_URL OIDC_ISSUER OIDC_CLIENT_ID OIDC_AUDIENCE PRODUCT_ID PRIVACY_URL TERMS_URL; do
            [[ -n "${!name}" ]] || { echo "$name eksik"; exit 1; }
          done

      - name: iOS uygulamasını derle
        working-directory: frontend
        shell: bash
        env:
          BACKEND_URL: ${{ vars.MAKI_BACKEND_URL }}
          OIDC_ISSUER: ${{ vars.MAKI_OIDC_ISSUER }}
          OIDC_CLIENT_ID: ${{ vars.MAKI_OIDC_CLIENT_ID }}
          OIDC_AUDIENCE: ${{ vars.MAKI_OIDC_AUDIENCE }}
          PRODUCT_ID: ${{ vars.MAKI_BILLING_PRODUCT_ID }}
          PRIVACY_URL: ${{ vars.MAKI_PRIVACY_URL }}
          TERMS_URL: ${{ vars.MAKI_TERMS_URL }}
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          flutter build ios --release --no-codesign \
            --dart-define=MAKI_ENV=production \
            --dart-define=BACKEND_URL="$BACKEND_URL" \
            --dart-define=OIDC_ISSUER="$OIDC_ISSUER" \
            --dart-define=OIDC_CLIENT_ID="$OIDC_CLIENT_ID" \
            --dart-define=OIDC_AUDIENCE="$OIDC_AUDIENCE" \
            --dart-define=OIDC_REDIRECT_URI=com.team120.maki:/oauth2redirect \
            --dart-define=BILLING_PRODUCT_ID="$PRODUCT_ID" \
            --dart-define=ENABLE_STORE_BILLING=true \
            --dart-define=PRIVACY_URL="$PRIVACY_URL" \
            --dart-define=TERMS_URL="$TERMS_URL"

      - name: İmzasız iOS derleme kanıtını yükle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maki-ios-unsigned-${{ github.ref_name }}
          path: frontend/build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 14
