name: maki_app
description: "Maki kişisel finans uygulaması."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  drift: ^2.35.3
  sqlite3: ^3.8.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.0
  cupertino_icons: ^2.0.0
  image_picker: ^1.2.4
  http: ^1.2.2
  fl_chart: ^1.3.0
  flutter_secure_storage: ^10.3.4
  http_parser: ^4.1.0
  flutter_markdown_plus: ^1.0.12
  maki_finance_core:
    path: ../packages/maki_finance_core
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  get_it: ^9.3.0
  shared_preferences: ^2.5.6
  oidc: 4.0.0
  oidc_default_store: any
  in_app_purchase: ^3.3.1
  sentry_flutter: ^10.2.0
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  public_file_saver: ^1.1.0
  pdf: ^3.13.1
  flutter_local_notifications: ^22.3.3
  flutter_timezone: ^5.1.1
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.35.2
  build_runner: ^2.17.1
  mocktail: any
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/mascot/
  fonts:
    - family: MakiSans
      fonts:
        - asset: assets/fonts/MakiSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/MakiSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/MakiSans-Bold.ttf
          weight: 700
    - family: MakiDisplay
      fonts:
        - asset: assets/fonts/MakiDisplay-Regular.ttf
          weight: 400
        - asset: assets/fonts/MakiDisplay-Bold.ttf
          weight: 700

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
