name: maki_app
description: "Maki kişisel finans uygulaması."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  drift: ^2.31.0
  sqlite3: ^2.9.0
  sqlite3_flutter_libs: ^0.5.25
  path_provider: ^2.1.3
  path: ^1.9.0
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  http: ^1.2.2
  fl_chart: ^0.70.2
  flutter_secure_storage: ^9.2.2
  http_parser: ^4.1.0
  flutter_markdown_plus: ^1.0.12
  maki_finance_core:
    path: ../packages/maki_finance_core
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  get_it: ^9.2.1
  shared_preferences: ^2.5.5
  oidc: any
  oidc_default_store: any
  in_app_purchase: ^3.2.0
  sentry_flutter: ^8.13.0
  url_launcher: ^6.3.0
  share_plus: ^10.1.0
  public_file_saver: ^1.1.0
  pdf: ^3.11.0
  flutter_local_notifications: ^18.0.1
  flutter_timezone: ^4.0.0
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.31.0
  build_runner: ^2.4.11
  mocktail: any
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/mascot/
  fonts:
    - family: MakiSans
      fonts:
        - asset: assets/fonts/MakiSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/MakiSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/MakiSans-Bold.ttf
          weight: 700
    - family: MakiDisplay
      fonts:
        - asset: assets/fonts/MakiDisplay-Regular.ttf
          weight: 400
        - asset: assets/fonts/MakiDisplay-Bold.ttf
          weight: 700

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
